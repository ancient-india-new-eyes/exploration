<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  :root{
    --ink:#1c1b19;
    --paper:#faf8f4;
    --line:#dcd7cd;
    --accent:#3a5a40;
    --muted:#8a8378;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  header{
    padding:48px 24px 24px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:clamp(28px,5vw,44px);
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  header p{
    color:var(--muted);
    margin:0;
    font-size:14px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:4px;
    padding:4px;
    max-width:1400px;
    margin:0 auto;
  }
  .grid figure{
    margin:0;
    position:relative;
    overflow:hidden;
    aspect-ratio:1/1;
    background:var(--line);
    cursor:pointer;
  }
  .grid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
  }
  .grid figure:hover img{
    transform:scale(1.05);
  }
  .grid figcaption{
    position:absolute;
    bottom:0;left:0;right:0;
    padding:10px 12px;
    font-size:12px;
    color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .grid figure:hover figcaption{opacity:1;}

  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.92);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .lightbox.active{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:90vh;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position:absolute;
    top:24px;right:32px;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
  }
  .lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#fff;
    font-size:36px;
    cursor:pointer;
    padding:12px 18px;
    opacity:0.7;
  }
  .lightbox-nav:hover{opacity:1;}
  .lightbox-prev{left:12px;}
  .lightbox-next{right:12px;}

  footer{
    text-align:center;
    padding:32px;
    color:var(--muted);
    font-size:12px;
  }
</style>
</head>
<body>

<header>
  <h1>Gallery</h1>
  <p>a collection of images</p>
</header>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lbNext">&#8250;</button>
</div>

<footer>Built with plain HTML — hosted free on GitHub Pages</footer>

<script>
  // ---- EDIT THIS LIST: add your image filenames here ----
  // Put your images in an "images" folder next to this file.
  const images = [
    { src: "images/photo1.jpg", caption: "Photo 1" },
    { src: "images/photo2.jpg", caption: "Photo 2" },
    { src: "images/photo3.jpg", caption: "Photo 3" }
  ];
  // ---------------------------------------------------------

  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  let current = 0;

  images.forEach((img, i) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${img.src}" alt="${img.caption}" loading="lazy"><figcaption>${img.caption}</figcaption>`;
    fig.addEventListener('click', () => openLightbox(i));
    grid.appendChild(fig);
  });

  function openLightbox(i){
    current = i;
    lbImg.src = images[i].src;
    lbImg.alt = images[i].caption;
    lightbox.classList.add('active');
  }
  function closeLightbox(){
    lightbox.classList.remove('active');
  }
  function show(delta){
    current = (current + delta + images.length) % images.length;
    lbImg.src = images[current].src;
    lbImg.alt = images[current].caption;
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => show(-1));
  document.getElementById('lbNext').addEventListener('click', () => show(1));
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') show(-1);
    if(e.key === 'ArrowRight') show(1);
  });
</script>

</body>
</html>
